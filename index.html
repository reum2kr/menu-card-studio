<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지 — 짤 카드 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --cream:#fbf6ee;
    --paper:#ffffff;
    --ink:#2b2420;
    --muted:#8a7f70;
    --line:#e7ddcc;
    --orange:#e2572b;
    --orange-deep:#b8431f;
    --plate:#d9a05b;
    --ok:#3f8f52;
    --danger:#c0392b;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --body:'Pretendard', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:var(--body);
    background:var(--cream);
    color:var(--ink);
    min-height:100svh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px;}

  header{margin-bottom:24px;}
  .eyebrow{font-family:var(--mono);font-size:12px;color:var(--orange-deep);letter-spacing:.08em;margin-bottom:6px;}
  h1{font-size:24px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin-top:6px;}

  .layout{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .stage-panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .ratio-row{display:flex;gap:8px;margin-bottom:14px;}
  .ratio-btn{
    font-family:var(--mono);font-size:12.5px;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .ratio-btn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;}

  .canvas-holder{
    display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(#f1ead9 0% 25%, #fbf6ee 0% 50%) 50% / 20px 20px;
    border-radius:12px;border:1px solid var(--line);overflow:hidden;
  }
  #stage{display:block;max-width:100%;height:auto;}

  .drop-hint{margin-top:12px;font-size:12.5px;color:var(--muted);}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .upload-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:var(--cream);
    font-size:13.5px;color:var(--ink);cursor:pointer;font-family:var(--body);
  }
  .upload-btn:hover{border-color:var(--orange);}
  input[type="file"]{display:none;}
  .file-error{
    display:none;margin-top:8px;font-size:12.5px;color:var(--danger);
    background:#fbeae7;border:1px solid #f0c9c1;border-radius:8px;padding:8px 10px;
  }
  .file-error.show{display:block;}

  input[type="text"]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--body);font-size:14px;background:var(--paper);color:var(--ink);
  }
  input[type="text"]:focus{border-color:var(--orange);}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .seg button{
    font-size:12.5px;padding:8px 4px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}

  input[type="range"]{width:100%;accent-color:var(--orange);}
  .range-val{font-family:var(--mono);font-size:12px;color:var(--muted);}

  .swatches{display:flex;gap:8px;align-items:center;}
  .swatch{
    width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  }
  .swatch[aria-pressed="true"]{border-color:var(--ink);}
  .swatch-custom{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer;overflow:hidden;
  }
  .swatch-custom input{width:150%;height:150%;transform:translate(-15%,-15%);cursor:pointer;border:none;}

  .download-btn{
    margin-top:4px;width:100%;padding:13px;border:none;border-radius:10px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--body);
  }
  .download-btn:hover{background:#000;}

  .template-save-row{display:flex;gap:8px;}
  .template-save-row input{
    flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--body);font-size:13.5px;
  }
  .tpl-btn-primary{
    padding:9px 14px;border:none;border-radius:8px;background:var(--orange);
    color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .tpl-btn-primary:hover{background:var(--orange-deep);}
  .tpl-hint{
    display:none;font-size:12px;color:var(--danger);margin-top:6px;
  }
  .tpl-hint.show{display:block;}
  .template-list{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .template-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--cream);
  }
  .template-item .tpl-name{
    flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .template-item.active{border-color:var(--orange);background:#fdece4;}
  .tpl-icon-btn{
    background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;
    font-size:12px;color:var(--muted);font-family:var(--mono);
  }
  .tpl-icon-btn:hover{background:var(--line);color:var(--ink);}
  .tpl-icon-btn.danger:hover{background:#fbeae7;color:var(--danger);}
  .template-empty{font-size:12.5px;color:var(--muted);padding:6px 0;}
  .tpl-json-row{display:flex;gap:8px;margin-top:10px;}
  .tpl-json-btn{
    flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
    font-size:12px;color:var(--ink);cursor:pointer;font-family:var(--body);
  }
  .tpl-json-btn:hover{border-color:var(--orange);}
  #importJsonInput{display:none;}

  footer{margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">MENU PICK STUDIO</div>
    <h1>오늘 뭐 먹지 — 짤 카드 스튜디오</h1>
    <p class="sub">음식 사진을 올리고, 문구·위치·크기·색을 바꿔서 나만의 메뉴 선택 카드를 만들어보세요.</p>
  </header>

  <div class="layout">
    <div>
      <div class="stage-panel">
        <div class="ratio-row" role="group" aria-label="화면 비율 선택">
          <button type="button" class="ratio-btn" data-ratio="1:1" aria-pressed="true">1:1</button>
          <button type="button" class="ratio-btn" data-ratio="4:5" aria-pressed="false">4:5</button>
          <button type="button" class="ratio-btn" data-ratio="9:16" aria-pressed="false">9:16</button>
        </div>
        <div class="canvas-holder">
          <canvas id="stage" width="800" height="800" role="img" aria-label="카드 미리보기"></canvas>
        </div>
      </div>
      <p class="drop-hint">미리보기 화면이 실제 저장되는 PNG 파일과 동일하게 나와요.</p>
    </div>

    <div class="panel">
      <div class="field">
        <label for="foodInput">음식 사진 (PNG, JPEG만 가능)</label>
        <button type="button" class="upload-btn" id="uploadBtn">
          <span id="uploadBtnLabel">음식 사진 업로드</span>
        </button>
        <input type="file" id="foodInput" accept="image/png,image/jpeg">
        <p class="file-error" id="fileError" role="alert"></p>
      </div>

      <div class="field">
        <label for="captionInput">문구</label>
        <input type="text" id="captionInput" value="오늘 점심은 짜장면" maxlength="60">
      </div>

      <div class="field">
        <label>문구 위치</label>
        <div class="seg" role="group" aria-label="문구 위치">
          <button type="button" data-pos="top" aria-pressed="true">상단</button>
          <button type="button" data-pos="middle" aria-pressed="false">중앙</button>
          <button type="button" data-pos="bottom" aria-pressed="false">하단</button>
        </div>
      </div>

      <div class="field">
        <label for="sizeInput">글자 크기 <span class="range-val" id="sizeVal">40px</span></label>
        <input type="range" id="sizeInput" min="16" max="72" value="40" step="1">
      </div>

      <div class="field">
        <label>글자 색</label>
        <div class="swatches" id="swatchRow">
          <button type="button" class="swatch" style="background:#2b2420" data-color="#2b2420" aria-pressed="true" aria-label="검정색"></button>
          <button type="button" class="swatch" style="background:#e2572b" data-color="#e2572b" aria-pressed="false" aria-label="주황색"></button>
          <button type="button" class="swatch" style="background:#3f8f52" data-color="#3f8f52" aria-pressed="false" aria-label="초록색"></button>
          <button type="button" class="swatch" style="background:#ffffff;border:1px solid var(--line)" data-color="#ffffff" aria-pressed="false" aria-label="흰색"></button>
          <label class="swatch-custom" aria-label="직접 색 선택">
            <input type="color" id="customColor" value="#2b2420">
          </label>
        </div>
      </div>

      <div class="field template-field">
        <label>템플릿</label>
        <div class="template-save-row">
          <input type="text" id="templateNameInput" placeholder="템플릿 이름">
          <button type="button" id="saveTemplateBtn" class="tpl-btn-primary">저장</button>
        </div>
        <p class="tpl-hint" id="tplHint"></p>
        <ul class="template-list" id="templateList"></ul>
        <div class="tpl-json-row">
          <button type="button" class="tpl-json-btn" id="exportJsonBtn">JSON 내보내기</button>
          <button type="button" class="tpl-json-btn" id="importJsonBtn">JSON 가져오기</button>
          <input type="file" id="importJsonInput" accept="application/json,.json">
        </div>
        <p class="tpl-hint" id="jsonHint"></p>
      </div>

      <button type="button" class="download-btn" id="downloadBtn">PNG로 저장</button>
    </div>
  </div>

  <footer>MENU PICK STUDIO — SKT ALEPH 과제 제출용</footer>
</div>

  const PLATE_FRAC = { x: 0.4804, y: 0.6533, rx: 0.1659, ry: 0.0455 };
  const baseImg = new Image();
  let baseImgReady = false;
  baseImg.onload = () => { baseImgReady = true; render(); };
  baseImg.src = BASE_IMG_SRC;

  function drawBaseIllustration(w, h){
    ctx.fillStyle = '#fdf1de';
    ctx.fillRect(0, 0, w, h);

    if(!baseImgReady){
      return { plateCx: w * PLATE_FRAC.x, plateCy: h * PLATE_FRAC.y, plateRx: w * PLATE_FRAC.rx, plateRy: h * PLATE_FRAC.ry };
    }

    const imgW = baseImg.naturalWidth, imgH = baseImg.naturalHeight;
    const scale = Math.max(w / imgW, h / imgH);
    const dw = imgW * scale, dh = imgH * scale;
    const dx = (w - dw) / 2;
    const dy = h - dh; // bottom-anchored so the plate (near the bottom of the art) stays in frame
    ctx.drawImage(baseImg, dx, dy, dw, dh);

    return {
      plateCx: dx + PLATE_FRAC.x * dw,
      plateCy: dy + PLATE_FRAC.y * dh,
      plateRx: PLATE_FRAC.rx * dw,
      plateRy: PLATE_FRAC.ry * dh,
    };
  }

  function drawFoodImage(plate){
    const rx = plate.plateRx * 0.94, ry = plate.plateRy * 0.9;
    if(!state.foodImage) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(plate.plateCx, plate.plateCy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#e3d5bd';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(plate.plateCx, plate.plateCy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.clip();

    const img = state.foodImage;
    const scale = Math.min((rx * 2) / img.width, (ry * 2) / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const dx = plate.plateCx - dw / 2, dy = plate.plateCy - dh / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();

    ctx.beginPath();
    ctx.ellipse(plate.plateCx, plate.plateCy, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#e3d5bd';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  function wrapText(text, maxWidth, fontSize){
    ctx.font = `700 ${fontSize}px Pretendard, sans-serif`;
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let current = '';

    function pushCurrent(){
      if(current){ lines.push(current); current = ''; }
    }

    words.forEach(word => {
      if(ctx.measureText(word).width > maxWidth){
        // A single "word" with no spaces (long URL, glued-together text,
        // etc.) can still be wider than the canvas — flush what's queued,
        // then break this word by character so it never runs off the edge.
        pushCurrent();
        let chunk = '';
        for(const ch of word){
          const test = chunk + ch;
          if(ctx.measureText(test).width > maxWidth && chunk){
            lines.push(chunk);
            chunk = ch;
          }else{
            chunk = test;
          }
        }
        current = chunk;
        return;
      }
      const test = current ? current + ' ' + word : word;
      if(ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = word;
      }else{
        current = test;
      }
    });
    if(current) lines.push(current);
    return lines.length ? lines : [''];
  }

  function drawCaption(w, h){
    if(!state.caption) return;
    const fontSize = state.fontSize;
    const maxWidth = w * 0.86;
    const lines = wrapText(state.caption, maxWidth, fontSize);
    const lineHeight = fontSize * 1.3;
    const blockHeight = lines.length * lineHeight;

    let startY;
    if(state.textPos === 'top') startY = h * 0.08 + fontSize;
    else if(state.textPos === 'middle') startY = h / 2 - blockHeight / 2 + fontSize;
    else startY = h * 0.94 - blockHeight;

    ctx.font = `700 ${fontSize}px Pretendard, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';

    lines.forEach((line, i) => {
      const y = startY + i * lineHeight;
      ctx.lineWidth = Math.max(3, fontSize * 0.12);
      ctx.strokeStyle = isLightColor(state.textColor) ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.7)';
      ctx.strokeText(line, w / 2, y);
      ctx.fillStyle = state.textColor;
      ctx.fillText(line, w / 2, y);
    });
  }

  function isLightColor(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    return (0.299*r + 0.587*g + 0.114*b) > 150;
  }

  function render(){
    const { w, h } = RATIOS[state.ratio];
    canvas.width = w;
    canvas.height = h;
    const plate = drawBaseIllustration(w, h);
    drawFoodImage(plate);
    drawCaption(w, h);
  }

  // ---- Ratio switch ----
  ratioButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      ratioButtons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      state.ratio = btn.dataset.ratio;
      render();
    });
  });

  // ---- Food image upload + validation ----
  uploadBtn.addEventListener('click', () => foodInput.click());

  foodInput.addEventListener('change', () => {
    const file = foodInput.files && foodInput.files[0];
    if(!file) return;

    const allowed = ['image/png', 'image/jpeg'];
    if(!allowed.includes(file.type)){
      fileError.textContent = `"${file.name}"은(는) 지원하지 않는 형식이에요. PNG 또는 JPEG 파일만 올릴 수 있어요.`;
      fileError.classList.add('show');
      foodInput.value = '';
      return; // existing work (state.foodImage) is left untouched
    }

    fileError.classList.remove('show');
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        state.foodImage = img;
        state.foodImageSrc = e.target.result;
        uploadBtnLabel.textContent = file.name;
        render();
      };
      img.onerror = () => {
        fileError.textContent = '이미지를 읽는 데 실패했어요. 다른 파일을 시도해주세요.';
        fileError.classList.add('show');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---- Caption text ----
  captionInput.addEventListener('input', () => {
    state.caption = captionInput.value;
    render();
  });

  // ---- Text position ----
  posButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      posButtons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      state.textPos = btn.dataset.pos;
      render();
    });
  });

  // ---- Font size ----
  sizeInput.addEventListener('input', () => {
    state.fontSize = Number(sizeInput.value);
    sizeVal.textContent = state.fontSize + 'px';
    render();
  });

  // ---- Text color ----
  function setColor(hex){
    state.textColor = hex;
    Array.from(swatchRow.querySelectorAll('.swatch')).forEach(s => {
      s.setAttribute('aria-pressed', String(s.dataset.color === hex));
    });
    render();
  }
  Array.from(swatchRow.querySelectorAll('.swatch')).forEach(btn => {
    btn.addEventListener('click', () => setColor(btn.dataset.color));
  });
  customColor.addEventListener('input', () => setColor(customColor.value));

  // ---- Download PNG ----
  downloadBtn.addEventListener('click', () => {
    render(); // ensure exact match between what's shown and what's exported
    const link = document.createElement('a');
    link.download = 'menu-pick-card.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---- Templates (create / load / edit / delete), persisted in localStorage ----
  const TEMPLATE_KEY = 'menu-card-templates-v1';

  function loadTemplates(){
    try{
      const raw = localStorage.getItem(TEMPLATE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      return [];
    }
  }
  function saveTemplates(list){
    try{ localStorage.setItem(TEMPLATE_KEY, JSON.stringify(list)); }
    catch(e){ /* storage unavailable — templates just won't persist */ }
  }

  let templates = loadTemplates();

  function showTplHint(msg){
    tplHint.textContent = msg;
    tplHint.classList.add('show');
  }
  function hideTplHint(){
    tplHint.classList.remove('show');
  }

  function currentStateSnapshot(name, id){
    return {
      id: id || ('tpl-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
      name,
      ratio: state.ratio,
      caption: state.caption,
      textPos: state.textPos,
      fontSize: state.fontSize,
      textColor: state.textColor,
      foodImageSrc: state.foodImageSrc,
    };
  }

  function renderTemplateList(){
    templateList.innerHTML = '';
    if(!templates.length){
      const li = document.createElement('li');
      li.className = 'template-empty';
      li.textContent = '저장된 템플릿이 없어요.';
      templateList.appendChild(li);
      return;
    }
    templates.forEach(tpl => {
      const li = document.createElement('li');
      li.className = 'template-item' + (tpl.id === state.activeTemplateId ? ' active' : '');

      const name = document.createElement('span');
      name.className = 'tpl-name';
      name.textContent = tpl.name;
      li.appendChild(name);

      const loadBtn = document.createElement('button');
      loadBtn.type = 'button';
      loadBtn.className = 'tpl-icon-btn';
      loadBtn.textContent = '불러오기';
      loadBtn.addEventListener('click', () => loadTemplate(tpl.id));
      li.appendChild(loadBtn);

      const overwriteBtn = document.createElement('button');
      overwriteBtn.type = 'button';
      overwriteBtn.className = 'tpl-icon-btn';
      overwriteBtn.textContent = '수정';
      overwriteBtn.title = '현재 편집 내용으로 이 템플릿을 덮어써요';
      overwriteBtn.addEventListener('click', () => overwriteTemplate(tpl.id));
      li.appendChild(overwriteBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'tpl-icon-btn danger';
      delBtn.textContent = '삭제';
      delBtn.addEventListener('click', () => deleteTemplate(tpl.id));
      li.appendChild(delBtn);

      templateList.appendChild(li);
    });
  }

  function createTemplate(){
    const name = templateNameInput.value.trim();
    if(!name){
      showTplHint('템플릿 이름을 입력해주세요.');
      return;
    }
    hideTplHint();
    const tpl = currentStateSnapshot(name);
    templates.push(tpl);
    saveTemplates(templates);
    state.activeTemplateId = tpl.id;
    templateNameInput.value = '';
    renderTemplateList();
  }

  // Look up by stable id — never by array position, since the list can be
  // re-ordered or filtered and an index would silently point at the wrong item.
  function findTemplateIndex(id){
    return templates.findIndex(t => t.id === id);
  }

  function loadTemplate(id){
    const idx = findTemplateIndex(id);
    if(idx === -1) return;
    const tpl = templates[idx];

    state.ratio = tpl.ratio;
    state.caption = tpl.caption;
    state.textPos = tpl.textPos;
    state.fontSize = tpl.fontSize;
    state.textColor = tpl.textColor;
    state.activeTemplateId = tpl.id;

    ratioButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ratio === tpl.ratio)));
    captionInput.value = tpl.caption;
    posButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pos === tpl.textPos)));
    sizeInput.value = tpl.fontSize;
    sizeVal.textContent = tpl.fontSize + 'px';
    Array.from(swatchRow.querySelectorAll('.swatch')).forEach(s => {
      s.setAttribute('aria-pressed', String(s.dataset.color === tpl.textColor));
    });
    customColor.value = tpl.textColor;

    if(tpl.foodImageSrc){
      const img = new Image();
      img.onload = () => {
        state.foodImage = img;
        state.foodImageSrc = tpl.foodImageSrc;
        uploadBtnLabel.textContent = tpl.name + ' (템플릿 이미지)';
        render();
      };
      img.src = tpl.foodImageSrc;
    }else{
      state.foodImage = null;
      state.foodImageSrc = null;
      uploadBtnLabel.textContent = '음식 사진 업로드';
      render();
    }
    renderTemplateList();
  }

  function overwriteTemplate(id){
    const idx = findTemplateIndex(id);
    if(idx === -1) return;
    const existingName = templates[idx].name;
    templates[idx] = currentStateSnapshot(existingName, id);
    saveTemplates(templates);
    state.activeTemplateId = id;
    renderTemplateList();
  }

  function deleteTemplate(id){
    const idx = findTemplateIndex(id);
    if(idx === -1) return;
    templates.splice(idx, 1);
    saveTemplates(templates);
    if(state.activeTemplateId === id) state.activeTemplateId = null;
    renderTemplateList();
  }

  saveTemplateBtn.addEventListener('click', createTemplate);
  templateNameInput.addEventListener('input', hideTplHint);

  // ---- JSON export / import (backup + restore) ----
  const REQUIRED_TPL_FIELDS = ['id', 'name', 'ratio', 'caption', 'textPos', 'fontSize', 'textColor'];
  const VALID_RATIOS = Object.keys(RATIOS);
  const VALID_POS = ['top', 'middle', 'bottom'];

  function showJsonHint(msg, isError){
    jsonHint.textContent = msg;
    jsonHint.classList.add('show');
    jsonHint.style.color = isError ? 'var(--danger)' : 'var(--ok)';
  }
  function hideJsonHint(){
    jsonHint.classList.remove('show');
  }

  // Returns { valid: true, data } or { valid: false, error }.
  // Nothing is written to templates/localStorage until this passes —
  // a bad file must never wipe out what's already saved.
  function validateTemplateJson(raw){
    let parsed;
    try{
      parsed = JSON.parse(raw);
    }catch(e){
      return { valid: false, error: '파일이 올바른 JSON 형식이 아니에요 (문법 오류).' };
    }
    if(!Array.isArray(parsed)){
      return { valid: false, error: 'JSON 최상위 구조가 배열이 아니에요.' };
    }
    for(let i = 0; i < parsed.length; i++){
      const item = parsed[i];
      if(typeof item !== 'object' || item === null){
        return { valid: false, error: `${i+1}번째 항목이 객체가 아니에요.` };
      }
      for(const field of REQUIRED_TPL_FIELDS){
        if(!(field in item)){
          return { valid: false, error: `${i+1}번째 항목에 필수 항목 "${field}"이(가) 없어요.` };
        }
      }
      if(!VALID_RATIOS.includes(item.ratio)){
        return { valid: false, error: `${i+1}번째 항목의 비율 값("${item.ratio}")이 올바르지 않아요.` };
      }
      if(!VALID_POS.includes(item.textPos)){
        return { valid: false, error: `${i+1}번째 항목의 문구 위치 값이 올바르지 않아요.` };
      }
      if(typeof item.fontSize !== 'number'){
        return { valid: false, error: `${i+1}번째 항목의 글자 크기가 숫자가 아니에요.` };
      }
    }
    return { valid: true, data: parsed };
  }

  exportJsonBtn.addEventListener('click', () => {
    hideJsonHint();
    const blob = new Blob([JSON.stringify(templates, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'menu-card-templates.json';
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
  });

  importJsonBtn.addEventListener('click', () => importJsonInput.click());

  importJsonInput.addEventListener('change', () => {
    const file = importJsonInput.files && importJsonInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const result = validateTemplateJson(e.target.result);
      if(!result.valid){
        showJsonHint('가져오기 실패: ' + result.error + ' 기존 템플릿은 그대로 유지돼요.', true);
        importJsonInput.value = '';
        return; // templates/localStorage untouched — existing list survives
      }
      templates = result.data;
      saveTemplates(templates);
      state.activeTemplateId = null;
      renderTemplateList();
      showJsonHint(`템플릿 ${templates.length}개를 정상적으로 불러왔어요.`, false);
      importJsonInput.value = '';
    };
    reader.onerror = () => {
      showJsonHint('파일을 읽는 데 실패했어요. 기존 템플릿은 그대로 유지돼요.', true);
      importJsonInput.value = '';
    };
    reader.readAsText(file);
  });

  // ---- Init ----
  renderTemplateList();
  render();
})();
</script>

</body>
</html>
